# Build a signed Android APK and publish it to GitHub Releases.
# Sideload distribution: no Play Store upload.
#
# Trigger: push a tag named vMAJOR.MINOR.PATCH (for example v1.2.3).
# versionName comes from that tag. versionCode is major*1000000 + minor*1000 + patch.
#
# Each release also uploads version.json. The app can poll the latest manifest at:
#   https://github.com/<owner>/<repo>/releases/latest/download/version.json
# apkUrl inside that file points at the DocKeeper-<version>.apk asset on the same release.
#
# Repository secrets (Settings > Secrets and variables > Actions):
#   SIGNING_KEY_STORE_BASE64  base64 of the release .jks keystore
#   SIGNKEY_STORE_PASSWORD    keystore password
#   SIGNKEY_KEY_ALIAS         key alias inside the keystore
#   SIGNKEY_KEY_PASSWORD      password for that alias

name: Build and Release APK

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      EXPO_NO_TELEMETRY: "1"

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check signing secrets
        env:
          SIGNING_KEY_STORE_BASE64: ${{ secrets.SIGNING_KEY_STORE_BASE64 }}
          SIGNKEY_STORE_PASSWORD: ${{ secrets.SIGNKEY_STORE_PASSWORD }}
          SIGNKEY_KEY_ALIAS: ${{ secrets.SIGNKEY_KEY_ALIAS }}
          SIGNKEY_KEY_PASSWORD: ${{ secrets.SIGNKEY_KEY_PASSWORD }}
        run: |
          missing=0
          for name in SIGNING_KEY_STORE_BASE64 SIGNKEY_STORE_PASSWORD SIGNKEY_KEY_ALIAS SIGNKEY_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "Missing GitHub Actions secret: $name"
              missing=1
            fi
          done
          exit "$missing"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Set app version from tag
        run: |
          node <<'EOF'
          const fs = require('fs');
          const tag = process.env.GITHUB_REF_NAME || '';
          const match = tag.match(/^v(\d+)\.(\d+)\.(\d+)$/);
          if (!match) {
            console.error(`Tag "${tag}" must look like v1.2.3`);
            process.exit(1);
          }
          const major = Number(match[1]);
          const minor = Number(match[2]);
          const patch = Number(match[3]);
          if (minor > 999 || patch > 999) {
            console.error('Minor and patch must be 999 or less so versionCode stays unique');
            process.exit(1);
          }
          const versionName = `${major}.${minor}.${patch}`;
          const versionCode = major * 1000000 + minor * 1000 + patch;
          const app = JSON.parse(fs.readFileSync('app.json', 'utf8'));
          app.expo.version = versionName;
          app.expo.android.versionCode = versionCode;
          fs.writeFileSync('app.json', JSON.stringify(app, null, 2) + '\n');
          console.log(`versionName=${versionName} versionCode=${versionCode}`);
          EOF

      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install

      - name: Point release builds at the CI keystore
        run: |
          node <<'EOF'
          const fs = require('fs');
          const file = 'android/app/build.gradle';
          let src = fs.readFileSync(file, 'utf8');
          const debugBlock = `        debug {
              storeFile file('debug.keystore')
              storePassword 'android'
              keyAlias 'androiddebugkey'
              keyPassword 'android'
          }`;
          const withRelease = `        debug {
              storeFile file('debug.keystore')
              storePassword 'android'
              keyAlias 'androiddebugkey'
              keyPassword 'android'
          }
          release {
              def ciStoreFile = System.getenv('SIGNING_STORE_FILE')
              if (ciStoreFile) {
                  storeFile file(ciStoreFile)
                  storePassword System.getenv('SIGNKEY_STORE_PASSWORD')
                  keyAlias System.getenv('SIGNKEY_KEY_ALIAS')
                  keyPassword System.getenv('SIGNKEY_KEY_PASSWORD')
              }
          }`;
          if (!src.includes(debugBlock)) {
            console.error('Could not find the debug signingConfig in android/app/build.gradle');
            process.exit(1);
          }
          src = src.replace(debugBlock, withRelease);
          const releaseLine = `            // see https://reactnative.dev/docs/signed-apk-android.
              signingConfig signingConfigs.debug`;
          const releaseNext = `            // see https://reactnative.dev/docs/signed-apk-android.
              signingConfig System.getenv('SIGNING_STORE_FILE') ? signingConfigs.release : signingConfigs.debug`;
          if (!src.includes(releaseLine)) {
            console.error('Could not find the release signingConfig line in android/app/build.gradle');
            process.exit(1);
          }
          src = src.replace(releaseLine, releaseNext);
          fs.writeFileSync(file, src);
          EOF

      - name: Decode Release Keystore
        env:
          SIGNING_KEY_STORE_BASE64: ${{ secrets.SIGNING_KEY_STORE_BASE64 }}
        run: echo "$SIGNING_KEY_STORE_BASE64" | base64 --decode > android/app/release.jks

      - name: Check keystore and alias
        env:
          SIGNKEY_STORE_PASSWORD: ${{ secrets.SIGNKEY_STORE_PASSWORD }}
          SIGNKEY_KEY_ALIAS: ${{ secrets.SIGNKEY_KEY_ALIAS }}
        run: |
          keytool -list \
            -keystore android/app/release.jks \
            -storepass "$SIGNKEY_STORE_PASSWORD" \
            -alias "$SIGNKEY_KEY_ALIAS"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          dependency-graph: disabled

      - name: Build Signed Release APK
        working-directory: android
        env:
          SIGNING_STORE_FILE: release.jks
          SIGNKEY_STORE_PASSWORD: ${{ secrets.SIGNKEY_STORE_PASSWORD }}
          SIGNKEY_KEY_ALIAS: ${{ secrets.SIGNKEY_KEY_ALIAS }}
          SIGNKEY_KEY_PASSWORD: ${{ secrets.SIGNKEY_KEY_PASSWORD }}
        run: |
          printf '\n%s\n' 'org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g' >> gradle.properties
          ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a

      - name: Verify the APK is not debug-signed
        run: |
          apk="android/app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$apk" ]; then
            echo "Signed APK was not produced at $apk"
            find android/app/build/outputs/apk -name '*.apk' -print
            exit 1
          fi
          apksigner="$(find "$ANDROID_SDK_ROOT/build-tools" "$ANDROID_HOME/build-tools" -name apksigner 2>/dev/null | sort | tail -1)"
          if [ -z "$apksigner" ]; then
            echo "apksigner was not found under the Android SDK"
            exit 1
          fi
          "$apksigner" verify --print-certs "$apk" | tee /tmp/apk-certs.txt
          if grep -q "CN=Android Debug" /tmp/apk-certs.txt; then
            echo "APK is signed with the Android debug keystore"
            exit 1
          fi
          version="${GITHUB_REF_NAME#v}"
          cp "$apk" "android/app/build/outputs/apk/release/DocKeeper-${version}.apk"

      - name: Write version.json
        run: |
          node <<'EOF'
          const fs = require('fs');
          const { execSync } = require('child_process');
          const tag = process.env.GITHUB_REF_NAME || '';
          const repository = process.env.GITHUB_REPOSITORY || '';
          const server = process.env.GITHUB_SERVER_URL || 'https://github.com';
          const match = tag.match(/^v(\d+)\.(\d+)\.(\d+)$/);
          if (!match) {
            console.error(`Tag "${tag}" must look like v1.2.3`);
            process.exit(1);
          }
          const major = Number(match[1]);
          const minor = Number(match[2]);
          const patch = Number(match[3]);
          const versionName = `${major}.${minor}.${patch}`;
          const versionCode = major * 1000000 + minor * 1000 + patch;
          const apkName = `DocKeeper-${versionName}.apk`;
          const apkUrl = `${server}/${repository}/releases/download/${tag}/${apkName}`;

          function git(command) {
            return execSync(command, { encoding: 'utf8' }).trim();
          }

          let releaseNotes = '';
          try {
            releaseNotes = git(`git tag -l --format=%(contents) ${tag}`);
          } catch {
            releaseNotes = '';
          }
          if (!releaseNotes) {
            try {
              const previous = git('git describe --tags --abbrev=0 HEAD^');
              releaseNotes = git(`git log --pretty=format:%s ${previous}..HEAD`);
            } catch {
              try {
                releaseNotes = git('git log -1 --pretty=format:%s');
              } catch {
                releaseNotes = '';
              }
            }
          }

          const manifest = { versionCode, versionName, apkUrl, releaseNotes };
          const out = 'android/app/build/outputs/apk/release/version.json';
          fs.writeFileSync(out, JSON.stringify(manifest, null, 2) + '\n');
          console.log(JSON.stringify({ versionCode, versionName, apkUrl }, null, 2));
          EOF

      - name: Publish Release to GitHub
        uses: softprops/action-gh-release@v2
        with:
          files: |
            android/app/build/outputs/apk/release/DocKeeper-*.apk
            android/app/build/outputs/apk/release/version.json
          generate_release_notes: true
          draft: false
          prerelease: false

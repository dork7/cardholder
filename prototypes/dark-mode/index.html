<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Doc Keeper · Dark mode prototype</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="studio">
    <header class="heading">
      <p class="eyebrow">Doc Keeper · PROTOTYPE · throwaway</p>
      <h1 id="title"></h1>
      <p id="blurb"></p>
    </header>
    <div id="screens" class="screens"></div>
    <section id="report" class="report" aria-label="Contrast report"></section>
    <div class="switcher" aria-label="Dark mode variations">
      <button id="previous" aria-label="Previous variation">←</button>
      <span id="label"></span>
      <button id="next" aria-label="Next variation">→</button>
    </div>
  </main>
  <script src="prototype.js"></script>
</body>
</html>

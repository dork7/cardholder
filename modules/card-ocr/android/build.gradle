plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.hamza.cardholder'
version = '0.1.0'

android {
  namespace "expo.modules.cardocr"
}

dependencies {
  // Google's on-device text reader through Google Play services, which downloads its Latin model once
  // (requested at install, see AndroidManifest.xml). About 5.5 MB smaller than bundling the model.
  // Reading still happens on the phone: no card leaves it.
  implementation 'com.google.android.gms:play-services-mlkit-text-recognition:19.0.1'
  testImplementation 'junit:junit:4.13.2'
}

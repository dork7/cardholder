plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.hamza.cardholder'
version = '0.1.0'

android {
  namespace "expo.modules.builtinmodel"
}

dependencies {
  // Gemini Nano through Android's AICore, on the phones that have it. Nothing leaves the phone; the
  // model itself is fetched by the system (AICore), not by the app.
  implementation 'com.google.mlkit:genai-prompt:1.0.0-beta4' // beta5 needs Kotlin 2.4; this app builds with 2.2
}
